name: Daily scan

# Biker crawl on GitHub Actions (JSON API, no browser).
# Avito sits behind Cloudflare, which serves a challenge to datacenter IPs —
# Browser Rendering cannot clear it. Avito motos, Avito cars, and Moteur run
# on a residential runner instead (local laptop or Pi via `npm run scan` /
# `schedule` with Playwright). Incremental: only listings newer than the last
# scrape watermark / crawl ledger.
on:
  schedule:
    - cron: '0 7 * * *' # every day, 07:00 UTC
  workflow_dispatch: # also triggered by the admin "Scan now" button

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scan Biker (incremental)
        run: npm run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          SCRAPE_SOURCES: biker
          NODE_ENV: production
