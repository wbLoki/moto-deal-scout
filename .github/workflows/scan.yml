name: Daily scan

# Watched-model re-check. Biker uses Playwright on the runner; Avito uses
# Cloudflare Browser Rendering REST (/content) so we stay within Workers Free
# (~10 browser-minutes/day, 1 request / 10s). Keep Avito shallow (1 page).
on:
  schedule:
    - cron: '0 7 * * *' # every day, 07:00 UTC
  workflow_dispatch: # also triggered by the admin "Scan now" button

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Biker still needs Chromium; Avito goes through Browser Rendering REST.
      - run: npx playwright install --with-deps chromium

      - name: Scan watched models
        run: npm run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Token needs "Browser Rendering - Edit". May reuse CLOUDFLARE_API_TOKEN
          # if that permission is included; otherwise set BROWSER_RENDERING_API_TOKEN.
          CLOUDFLARE_API_TOKEN: ${{ secrets.BROWSER_RENDERING_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          SCRAPE_SOURCES: avito,biker
          # Free REST Quick Actions: 1 request / 10s.
          SCRAPE_THROTTLE_MS: '10000'
          AVITO_MAX_PAGES: '1'
          NODE_ENV: production
