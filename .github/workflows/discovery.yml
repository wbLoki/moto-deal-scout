name: Weekly model discovery

# The deep crawl walks Biker's entire motorcycle category — tens of pages with
# a polite pause — which is far longer than Workers Free Browser Rendering
# allows (~10 min/day). Avito discovery stays local/Playwright when needed
# (`discover --source avito`). Daily watched-model Avito uses BR in scan.yml.
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays, 03:00 UTC
  workflow_dispatch:
    inputs:
      maxPages:
        description: 'Pages to crawl per source'
        required: false
        default: '40'

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Crawl and discover models
        run: npm run discover -- --max-pages "${{ inputs.maxPages || '40' }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          # A datacenter IP is a different traffic profile than a laptop, so
          # back off further than the local default.
          SCRAPE_THROTTLE_MS: '3000'
          # Avito's Datadome blocks datacenter IPs, so this crawl only does
          # Biker. Avito is scraped from a residential connection (locally, and
          # later a Raspberry Pi) — see `discover --source avito`.
          SCRAPE_SOURCES: biker
          NODE_ENV: production
